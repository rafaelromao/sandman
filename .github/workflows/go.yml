name: CI

on:
  workflow_call:
    secrets:
      OPENCODE_API_KEY:
        required: false
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Superseded runs cancel only within the same PR; main pushes remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security-check.yml

  workflow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
      - name: Install pinned validators
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          mkdir -p "$RUNNER_TEMP/shellcheck"
          curl --fail --silent --show-error --location https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          echo '6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  '"$RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/shellcheck" --strip-components=1
          echo "$RUNNER_TEMP/shellcheck" >> "$GITHUB_PATH"
      - run: make workflow-check
  semantic-pull-request:
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    env:
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            chore
            docs
            refactor
            test
            build
            ci
            revert
          requireScope: false

      - name: Validate change-request title regex
        run: |
          if ! echo "$TITLE" | grep -Eq '^(feat|fix|perf|chore|docs|refactor|test|build|ci|revert|feat!|fix!|perf!)(\([a-z0-9-]+\))?!?: .+'; then
            echo "::error::Change-request title '$TITLE' does not match the Conventional Commits regex documented in AGENTS.md." >&2
            echo "::error::Expected: ^(feat|fix|perf|chore|docs|refactor|test|build|ci|revert|feat!|fix!|perf!)(\([a-z0-9-]+\))?!?: .+" >&2
            exit 1
          fi

  portal-continuity-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up Chrome for Portal continuity tests
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Portal continuity browser gate
        env:
          SANDMAN_REQUIRE_PORTAL_BROWSER: "1"
          SANDMAN_PORTAL_CHROMIUM: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bash scripts/ci_report.sh portal-browser make test-browser
      - name: Summarize interrupted portal-browser validation
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p reports
          if [ ! -f reports/portal-browser.json ]; then
            echo "## portal-browser: $RESULT; validation did not complete" > reports/portal-browser-setup.md
            echo 'See setup/validation step logs; artifact: portal-browser-${{ runner.os }}.' >> reports/portal-browser-setup.md
            cat reports/portal-browser-setup.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish portal-browser reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-browser-${{ runner.os }}
          path: reports/
          if-no-files-found: warn

  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        id: snapshot
        with:
          args: release --snapshot --clean
          version: v2.10.1

      - name: Summarize packaging
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "## Packaging: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Artifact: packaging-Linux (dist/); diagnostics: GoReleaser step log.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish packaging reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaging-${{ runner.os }}
          path: dist/
          if-no-files-found: warn

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
      - name: Static validation
        run: bash scripts/ci_report.sh static-analysis make fmt-check vet staticcheck
      - name: Summarize interrupted static-analysis validation
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p reports
          if [ ! -f reports/static-analysis.json ]; then
            echo "## static-analysis: $RESULT; validation did not complete" > reports/static-analysis-setup.md
            echo 'See setup/validation step logs; artifact: static-analysis-${{ runner.os }}.' >> reports/static-analysis-setup.md
            cat reports/static-analysis-setup.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish static-analysis reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-analysis-${{ runner.os }}
          path: reports/
          if-no-files-found: warn

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
      - name: Architecture and documentation contracts
        run: bash scripts/ci_report.sh contracts make contracts
      - name: Summarize interrupted contracts validation
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p reports
          if [ ! -f reports/contracts.json ]; then
            echo "## contracts: $RESULT; validation did not complete" > reports/contracts-setup.md
            echo 'See setup/validation step logs; artifact: contracts-${{ runner.os }}.' >> reports/contracts-setup.md
            cat reports/contracts-setup.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish contracts reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contracts-${{ runner.os }}
          path: reports/
          if-no-files-found: warn

  build-linux:
    permissions:
      contents: read
      actions: read
    name: build (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Podman
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if command -v podman >/dev/null 2>&1; then
            echo "Podman already installed: $(podman --version)"
            exit 0
          fi
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=30s 3m bash -e -c '
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y --no-install-recommends podman
          '

      - name: Configure Podman runtime
        if: runner.os == 'Linux'
        run: |
          export CONTAINERS_CONF="$RUNNER_TEMP/containers.conf"
          echo "CONTAINERS_CONF=$CONTAINERS_CONF" >> "$GITHUB_ENV"
          cat > "$CONTAINERS_CONF" <<'EOF'
          [engine]
          runtime = "runc"
          EOF

      - name: Validate Podman
        if: runner.os == 'Linux'
        run: |
          test "$(podman info --format '{{.Host.OCIRuntime.Name}}')" = "runc"
          podman run --rm alpine true

      - name: Test
        id: race
        env:
          GH_TOKEN: ${{ github.token }}
          SANDMAN_TEST_PROVIDERS: ""
          SANDMAN_RUN_SMOKE_E2E: "0"
          SANDMAN_RUN_AGENT_E2E: "0"
          SANDMAN_E2E_GATES: ""
        run: bash scripts/ci_report.sh race-linux make build-check test-ci

      - name: Fake subagent container permissions
        env:
          SANDMAN_E2E_GATES: opencode_subagent
        run: bash scripts/ci_report.sh container-permissions go test -tags e2e -json -count=1 -timeout=12m ./internal/cmd -run '^Test(OpencodeSubagentPermissionAllowAll|PermissionFakeAgentHomeIsolatedFromHostState|PythonBuildSecretIsTransient)$'

      - name: Report Go coverage and evaluate policy
        if: ${{ always() && hashFiles('reports/coverage.out') != '' }}
        env:
          COVERAGE_TEST_RESULT: ${{ steps.race.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/coverage_report.py --platform linux

      - name: Publish platform coverage baseline
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: |
            reports/coverage.json
            reports/coverage.md
            reports/coverage.out
          if-no-files-found: warn

      - name: Summarize interrupted race-linux validation
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p reports
          if [ ! -f reports/race-linux.json ]; then
            echo "## race-linux: $RESULT; validation did not complete" > reports/race-linux-setup.md
            echo 'See setup/validation step logs; artifact: race-linux-${{ runner.os }}.' >> reports/race-linux-setup.md
            cat reports/race-linux-setup.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish race-linux reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: race-linux-${{ runner.os }}
          path: reports/
          if-no-files-found: warn

  build-macos:
    permissions:
      contents: read
      actions: read
    name: build (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Test
        id: race
        env:
          GH_TOKEN: ${{ github.token }}
          SANDMAN_TEST_PROVIDERS: ""
          SANDMAN_RUN_SMOKE_E2E: "0"
          SANDMAN_RUN_AGENT_E2E: "0"
          SANDMAN_E2E_GATES: ""
        run: bash scripts/ci_report.sh race-macos make build-check test-ci

      - name: Report Go coverage and evaluate policy
        if: ${{ always() && hashFiles('reports/coverage.out') != '' }}
        env:
          COVERAGE_TEST_RESULT: ${{ steps.race.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/coverage_report.py --platform macos

      - name: Publish platform coverage baseline
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-macos
          path: |
            reports/coverage.json
            reports/coverage.md
            reports/coverage.out
          if-no-files-found: warn

      - name: Summarize interrupted race-macos validation
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: |
          mkdir -p reports
          if [ ! -f reports/race-macos.json ]; then
            echo "## race-macos: $RESULT; validation did not complete" > reports/race-macos-setup.md
            echo 'See setup/validation step logs; artifact: race-macos-${{ runner.os }}.' >> reports/race-macos-setup.md
            cat reports/race-macos-setup.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish race-macos reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: race-macos-${{ runner.os }}
          path: reports/
          if-no-files-found: warn

  opencode-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install release-pinned OpenCode
        run: npm install -g "opencode-ai@$(python3 -c 'import json; print(json.load(open("scripts/release_scenarios.json"))["providers"]["opencode"]["cli"])')"
      - name: One minimal provider request
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python3 scripts/opencode_canary.py

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ always() }}
    needs: [opencode-canary, security, workflow-validation, static-analysis, contracts, build-linux, build-macos, portal-continuity-browser, goreleaser, semantic-pull-request]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require mandatory checks
        env:
          OPENCODE_RESULT: ${{ needs.opencode-canary.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-validation.result }}
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          CONTRACT_RESULT: ${{ needs.contracts.result }}
          EVENT_NAME: ${{ github.event_name }}
          LINUX_BUILD_RESULT: ${{ needs.build-linux.result }}
          MACOS_BUILD_RESULT: ${{ needs.build-macos.result }}
          PORTAL_RESULT: ${{ needs.portal-continuity-browser.result }}
          PACKAGING_RESULT: ${{ needs.goreleaser.result }}
          TITLE_RESULT: ${{ needs.semantic-pull-request.result }}
        run: bash scripts/quality_gate.sh
