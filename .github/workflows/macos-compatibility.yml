name: macOS Compatibility

on:
  workflow_dispatch:
  push:
    branches: [release-please--branches--main]

permissions:
  contents: read

concurrency:
  group: macos-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Native Compatibility (macOS Intel)
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      CI: "true"
      SANDMAN_TEST_PROVIDERS: all
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build native Sandman
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(go env GOOS)" = "darwin"
          test "$(go env GOARCH)" = "amd64"
          go build -o "$RUNNER_TEMP/sandman" ./cmd/sandman
          file "$RUNNER_TEMP/sandman"
          "$RUNNER_TEMP/sandman" version

      - name: Test native socket compatibility
        run: |
          go test -race -v -timeout 10m \
            ./internal/socketpath ./internal/review ./internal/daemon ./internal/cmd \
            -run '^(TestPath_(LongLogicalPathIsShortenedOnEveryOS|LongLogicalPathIsDeterministic)|TestDaemon_SocketPathAndSocketAddrAgreeForLongPath|TestControlSocket_StartForLongPathCreatesShortFilesystemSocket|TestCommandServer_StartUsesShortFilesystemSocketForLongPath|TestResolvePortalPeerPIDReturnsCallerPID|TestDiscoverPortalInstances_LongPathBindsAndDials|TestPortal_RunStream_BridgesControlSocketToSSE|TestAttach_(ReadsFromSocket|ExitsOnEOF|FindsLongPathReviewSock))$'

      - name: Test native portal process
        env:
          SANDMAN_E2E_GATES: portal
        run: |
          go test -v -tags e2e -timeout 10m ./internal/cmd \
            -run '^TestPortal_E2E_TwoLiveRuns$'

      - name: Test native portal abort endpoint
        env:
          SANDMAN_E2E_GATES: portal
        run: |
          go test -v -tags e2e -timeout 10m ./internal/cmd \
            -run '^TestPortal_E2E_AbortReturns404ForUnknownRun$'
