name: PR release validation

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

# Maintainers can validate a release repair before merging it. Fork PRs never
# receive provider credentials, and ordinary PRs do not run these tiers.
concurrency:
  group: pr-release-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    if: github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'release-validation')
    uses: ./.github/workflows/full-regression-linux.yml
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
