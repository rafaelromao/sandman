name: Native Compatibility

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [release-please--branches--main]

permissions:
  contents: read

concurrency:
  group: native-compatibility-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  darwin-amd64:
    name: Native Compatibility (darwin/amd64)
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      CI: "true"
      SANDMAN_TEST_PROVIDERS: all
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare native evidence
        run: |
          mkdir -p regression-artifacts
          touch regression-artifacts/events.jsonl
          echo "$GITHUB_SHA" > regression-artifacts/source-sha.txt

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Build native Sandman (Intel)
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(go env GOOS)" = "darwin"
          test "$(go env GOARCH)" = "amd64"
          go build -o "$RUNNER_TEMP/sandman" ./cmd/sandman
          go version > regression-artifacts/versions.txt
          go env GOOS GOARCH >> regression-artifacts/versions.txt
          file "$RUNNER_TEMP/sandman"
          "$RUNNER_TEMP/sandman" version

      - name: Test native socket compatibility
        run: |
          go test -race -json -count=1 -timeout 10m \
            ./internal/socketpath ./internal/review ./internal/daemon ./internal/cmd \
            -run '^(TestPath_(LongLogicalPathIsShortenedOnEveryOS|LongLogicalPathIsDeterministic)|TestDaemon_SocketPathAndSocketAddrAgreeForLongPath|TestControlSocket_StartForLongPathCreatesShortFilesystemSocket|TestCommandServer_StartUsesShortFilesystemSocketForLongPath|TestResolvePortalPeerPIDReturnsCallerPID|TestDiscoverPortalInstances_LongPathBindsAndDials|TestPortal_RunStream_BridgesControlSocketToSSE|TestAttach_(ReadsFromSocket|ExitsOnEOF|FindsLongPathReviewSock))$' 2>&1 | tee -a regression-artifacts/events.jsonl

      - name: Test native portal process
        env:
          SANDMAN_E2E_GATES: portal
        run: |
          go test -json -count=1 -tags e2e -timeout 10m ./internal/cmd \
            -run '^TestPortal_E2E_TwoLiveRuns$' 2>&1 | tee -a regression-artifacts/events.jsonl

      - name: Test native portal abort endpoint
        env:
          SANDMAN_E2E_GATES: portal
        run: |
          go test -json -count=1 -tags e2e -timeout 10m ./internal/cmd \
            -run '^TestPortal_E2E_AbortReturns404ForUnknownRun$' 2>&1 | tee -a regression-artifacts/events.jsonl

      - name: Evaluate native coverage
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          rc=1
          if [ "$JOB_STATUS" = success ]; then rc=0; fi
          RELEASE_PLATFORM="$(go env GOOS)/$(go env GOARCH)"
          export RELEASE_PLATFORM
          python3 scripts/release_report.py native regression-artifacts/events.jsonl "$rc" regression-artifacts/report.json

      - name: Upload native evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-darwin-amd64-${{ github.sha }}
          path: regression-artifacts/
          if-no-files-found: error

