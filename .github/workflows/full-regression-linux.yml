name: Full Regression - Linux

# Release Please pushes updates to this branch; the resulting checks appear on
# its open release PR without running on ordinary pull requests.
on:
  workflow_dispatch:
  push:
    branches: [release-please--branches--main]

jobs:
  full-regression:
    name: Full Regression Suite (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CI: true
      SANDMAN_FULL_REGRESSION: "1"
      GIT_TERMINAL_PROMPT: "0"
      DEBIAN_FRONTEND: noninteractive
      PAGER: cat
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      REPORT_FILE: regression-report-linux.md

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Configure Podman runtime
        run: |
          export CONTAINERS_CONF="$RUNNER_TEMP/containers.conf"
          echo "CONTAINERS_CONF=$CONTAINERS_CONF" >> "$GITHUB_ENV"
          cat > "$CONTAINERS_CONF" <<'EOF'
          [engine]
          runtime = "runc"
          EOF

      - name: Validate Podman
        run: |
          test "$(podman info --format '{{.Host.OCIRuntime.Name}}')" = "runc"
          podman run --rm alpine true

      - name: Install opencode CLI
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt to install opencode CLI..."
            if curl -fsSL https://opencode.ai/install | bash; then
              echo "opencode install succeeded on attempt $attempt"
              break
            fi
            echo "::warning::opencode install failed on attempt $attempt"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::opencode install failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version || echo "::warning::opencode binary not found after install"

      - name: Provision opencode auth
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -n "$OPENCODE_API_KEY" ]; then
            mkdir -p "$HOME/.local/share/opencode"
            printf '{"opencode": {"type": "api", "key": "%s"}}\n' "$OPENCODE_API_KEY" > "$HOME/.local/share/opencode/auth.json"
          else
            echo "No OPENCODE_API_KEY secret configured; real-agent tests that require auth will skip cleanly."
          fi

      - name: Prepare regression report
        shell: bash
        run: |
          mkdir -p regression-artifacts
          {
            echo "# Full Regression Report — Linux"
            echo ""
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
          } > "$REPORT_FILE"

      # Tier 1: Unit tests + race detector (matches `make test`). The default
      # per-package `go test` timeout (10m) applies; 30m is only a backstop.
      - name: Run regression tier — Unit + Race
        shell: bash
        run: |
          scripts/full_regression_tier.sh "Unit + Race" \
            "go test -race -json ./..." \
            "30m" "$REPORT_FILE" "regression-artifacts"

      # Tier 2: Focused smoke tests. `-timeout 60m` stays the tuned budget;
      # 65m is only a backstop.
      - name: Run regression tier — Smoke
        shell: bash
        run: |
          scripts/full_regression_tier.sh "Smoke" \
            "SANDMAN_TEST_PROVIDERS=all SANDMAN_RUN_SMOKE_E2E=1 go test -tags smoke -json -timeout 60m ./internal/cmd -run Smoke" \
            "65m" "$REPORT_FILE" "regression-artifacts"

      # Tier 3: E2E tests, every scenario gate and real-agent matrix.
      # `-timeout 90m` stays the tuned budget; 95m is only a backstop.
      - name: Run regression tier — E2E
        shell: bash
        run: |
          scripts/full_regression_tier.sh "E2E" \
            "SANDMAN_RUN_AGENT_E2E=1 SANDMAN_TEST_PROVIDERS=all SANDMAN_E2E_GATES=all go test -tags e2e -json -timeout 90m ./..." \
            "95m" "$REPORT_FILE" "regression-artifacts"

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-linux
          path: |
            regression-report-linux.md
            regression-artifacts
          if-no-files-found: ignore
