name: Full Regression - Linux

# Expensive release validation never runs on ordinary PRs.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [release-please--branches--main]

permissions:
  contents: read

jobs:
  unit:
    uses: ./.github/workflows/release-regression-tier.yml
    with:
      tier: unit

  smoke:
    uses: ./.github/workflows/release-regression-tier.yml
    with:
      tier: smoke

  integration:
    uses: ./.github/workflows/release-regression-tier.yml
    with:
      tier: integration

  scripted:
    uses: ./.github/workflows/release-regression-tier.yml
    with:
      tier: scripted

  scripted-host:
    uses: ./.github/workflows/release-regression-tier.yml
    with:
      tier: scripted-host

  release-gate:
    name: Release regression gate
    if: ${{ always() }}
    needs: [unit, smoke, integration, scripted, scripted-host]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every tier
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SCRIPTED_RESULT: ${{ needs.scripted.result }}
          SCRIPTED_HOST_RESULT: ${{ needs.scripted-host.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$SMOKE_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$SCRIPTED_RESULT" = success
          test "$SCRIPTED_HOST_RESULT" = success
