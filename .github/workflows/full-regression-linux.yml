name: Full Regression - Linux

# Expensive release validation never runs on ordinary PRs.
on:
  workflow_dispatch:
  push:
    branches: [release-please--branches--main]

permissions:
  contents: read

jobs:
  unit:
    uses: ./.github/workflows/release-regression-tier.yml
    with:
      tier: unit

  smoke:
    uses: ./.github/workflows/release-regression-tier.yml
    with:
      tier: smoke

  integration:
    uses: ./.github/workflows/release-regression-tier.yml
    with:
      tier: integration

  live:
    uses: ./.github/workflows/release-regression-tier.yml
    with:
      tier: live
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  release-gate:
    name: Release regression gate
    if: ${{ always() }}
    needs: [unit, smoke, integration, live]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every tier
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          LIVE_RESULT: ${{ needs.live.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$SMOKE_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$LIVE_RESULT" = success
