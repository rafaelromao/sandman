name: Security validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - name: Install pinned scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Security validation
        run: |
          python3 scripts/security_policy_test.py
          python3 scripts/security_check_test.py
          make security-check
      - name: Security result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "Security validation $RESULT. See step status; reproduce locally with make security-check." >> "$GITHUB_STEP_SUMMARY"
