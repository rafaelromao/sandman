name: Security validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      - name: Install pinned scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Security validation
        run: |
          python3 scripts/security_policy_test.py
          python3 scripts/security_check_test.py
          make security-check
      - name: Security result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "Security validation $RESULT. See step status; reproduce locally with make security-check." >> "$GITHUB_STEP_SUMMARY"
