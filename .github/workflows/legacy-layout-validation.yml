name: Validate legacy skill migration
on:
  push:
    branches: [codex/3039-legacy-layout-validation]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Targeted skill tests
        run: go test -count=1 ./internal/skill/...
      - name: Skill race tests
        run: go test -race -count=1 ./internal/skill/...
      - name: Contracts
        run: make contracts
      - name: Full checks
        run: make check
