name: Release regression tier

on:
  workflow_call:
    inputs:
      tier:
        required: true
        type: string

permissions:
  contents: read

jobs:
  tier:
    name: Release regression (${{ inputs.tier }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      SANDMAN_FULL_REGRESSION: "1"
      GIT_TERMINAL_PROMPT: "0"
      DEBIAN_FRONTEND: noninteractive
      PAGER: cat
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MISE_GITHUB_TOKEN: ${{ github.token }}
      SANDMAN_TEST_PROVIDERS: all
      SANDMAN_E2E_GATES: all
      SANDMAN_RUN_PORTAL_BINARY_E2E: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare evidence
        run: |
          mkdir -p regression-artifacts
          touch regression-artifacts/events.jsonl
          echo "$GITHUB_SHA" > regression-artifacts/source-sha.txt

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version

      - name: Set up Node
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Chromium
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install Podman
        id: podman
        timeout-minutes: 5
        run: |
          if command -v podman >/dev/null 2>&1; then
            echo "Podman already installed: $(podman --version)"
            exit 0
          fi
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=30s 3m bash -e -c '
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y --no-install-recommends podman
          '

      - name: Configure Podman runtime
        id: runtime
        run: |
          export CONTAINERS_CONF="$RUNNER_TEMP/containers.conf"
          echo "CONTAINERS_CONF=$CONTAINERS_CONF" >> "$GITHUB_ENV"
          cat > "$CONTAINERS_CONF" <<'EOF'
          [engine]
          runtime = "runc"
          EOF

      - name: Validate Podman
        id: container
        run: |
          test "$(podman info --format '{{.Host.OCIRuntime.Name}}')" = "runc"
          podman run --rm alpine true

      - name: Install pinned OpenCode CLI
        id: agents
        if: inputs.tier == 'smoke' || inputs.tier == 'scripted' || inputs.tier == 'scripted-host'
        timeout-minutes: 5
        run: npm install -g "opencode-ai@$(python3 -c 'import json; print(json.load(open("scripts/release_scenarios.json"))["providers"]["opencode"]["cli"])')"

      - name: Validate prerequisites and record versions
        id: prerequisites
        env:
          SANDMAN_PORTAL_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
          RELEASE_TIER: ${{ inputs.tier }}
        run: |
          test "$(go env GOOS)/$(go env GOARCH)" = linux/amd64
          node --version
          "$SANDMAN_PORTAL_CHROMIUM" --version
          if [ "$RELEASE_TIER" = scripted-host ] || [ "$RELEASE_TIER" = scripted ] || [ "$RELEASE_TIER" = smoke ]; then
            test "$(opencode --version)" = "$(python3 -c 'import json; print(json.load(open("scripts/release_scenarios.json"))["providers"]["opencode"]["cli"])')"
          fi
          {
            go version
            node --version
            "$SANDMAN_PORTAL_CHROMIUM" --version
            podman --version
            if [ "$RELEASE_TIER" = scripted-host ] || [ "$RELEASE_TIER" = scripted ] || [ "$RELEASE_TIER" = smoke ]; then
              opencode --version
            fi
          } > regression-artifacts/versions.txt

      - name: Execute tier
        id: tests
        if: inputs.tier != 'scripted-host'
        env:
          RELEASE_TIER: ${{ inputs.tier }}
          SANDMAN_PORTAL_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
          SANDMAN_REQUIRE_PORTAL_BROWSER: "1"
        run: bash scripts/release_tier.sh

      - name: Execute host-agent tier on loopback only
        id: host_tests
        if: inputs.tier == 'scripted-host'
        env:
          RELEASE_TIER: scripted-host
        run: |
          go mod download
          sudo --preserve-env=CI,SANDMAN_FULL_REGRESSION,RELEASE_TIER unshare --net sh -ec '
            ip link set lo up
            exec runuser -u "$1" -- env "PATH=$2" GOPROXY=off GOTOOLCHAIN=local bash scripts/release_tier.sh
          ' sh "$(id -un)" "$PATH"

      - name: Evaluate complete scenario coverage
        if: ${{ always() }}
        env:
          RELEASE_PREREQUISITES: >-
            {"go":"${{ steps.go.outcome }}","node":"${{ steps.node.outcome }}",
            "chromium":"${{ steps.chrome.outcome }}","podman":"${{ steps.podman.outcome }}",
            "runtime":"${{ steps.runtime.outcome }}","container":"${{ steps.container.outcome }}",
             "agents":"${{ steps.agents.outcome }}",
             "versions":"${{ steps.prerequisites.outcome }}","tests":"${{ steps.tests.outcome }}",
             "host_tests":"${{ steps.host_tests.outcome }}"}
          RELEASE_TIER: ${{ inputs.tier }}
        run: |
          rc=1
          if [ -f regression-artifacts/exit-code ]; then
            rc=$(cat regression-artifacts/exit-code)
          fi
          python3 scripts/release_report.py "$RELEASE_TIER" regression-artifacts/events.jsonl "$rc" regression-artifacts/report.json

      - name: Clean up tier containers
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          if command -v podman >/dev/null 2>&1; then
            podman ps -aq | xargs -r podman rm -f
          fi

      - name: Upload regression report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-regression-${{ inputs.tier }}-${{ github.sha }}
          path: regression-artifacts/
          if-no-files-found: error
