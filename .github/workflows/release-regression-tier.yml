name: Release regression tier

on:
  workflow_call:
    inputs:
      tier:
        required: true
        type: string
    secrets:
      OPENCODE_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  tier:
    name: Release regression (${{ inputs.tier }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      SANDMAN_FULL_REGRESSION: "1"
      GIT_TERMINAL_PROMPT: "0"
      DEBIAN_FRONTEND: noninteractive
      PAGER: cat
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      SANDMAN_TEST_MODEL_OPENCODE: opencode/big-pickle
      SANDMAN_TEST_MODEL_CLAUDE: claude-haiku-4-5-20251001
      SANDMAN_TEST_PROVIDERS: ${{ inputs.tier == 'claude' && 'claude' || inputs.tier == 'live' && 'opencode' || 'all' }}
      SANDMAN_E2E_GATES: all

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare evidence
        run: |
          mkdir -p regression-artifacts
          touch regression-artifacts/events.jsonl
          echo "$GITHUB_SHA" > regression-artifacts/source-sha.txt

      - name: Set up Go
        id: go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version

      - name: Set up Node
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up Chromium
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install Podman
        id: podman
        timeout-minutes: 5
        run: |
          if command -v podman >/dev/null 2>&1; then
            echo "Podman already installed: $(podman --version)"
            exit 0
          fi
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=30s 3m bash -e -c '
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y --no-install-recommends podman
          '

      - name: Configure Podman runtime
        id: runtime
        run: |
          export CONTAINERS_CONF="$RUNNER_TEMP/containers.conf"
          echo "CONTAINERS_CONF=$CONTAINERS_CONF" >> "$GITHUB_ENV"
          cat > "$CONTAINERS_CONF" <<'EOF'
          [engine]
          runtime = "runc"
          EOF

      - name: Validate Podman
        id: container
        run: |
          test "$(podman info --format '{{.Host.OCIRuntime.Name}}')" = "runc"
          podman run --rm alpine true

      - name: Install pinned agent CLIs
        id: agents
        if: inputs.tier == 'live' || inputs.tier == 'claude'
        timeout-minutes: 5
        env:
          RELEASE_TIER: ${{ inputs.tier }}
        run: |
          if [ "$RELEASE_TIER" = claude ]; then
            npm install -g @anthropic-ai/claude-code@2.1.283
          else
            npm install -g opencode-ai@1.18.0
          fi

      - name: Validate prerequisites and record versions
        id: prerequisites
        env:
          SANDMAN_PORTAL_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
          RELEASE_TIER: ${{ inputs.tier }}
        run: |
          test "$(go env GOOS)/$(go env GOARCH)" = linux/amd64
          node --version
          "$SANDMAN_PORTAL_CHROMIUM" --version
          if [ "$RELEASE_TIER" = live ]; then
            test "$(opencode --version)" = 1.18.0
          elif [ "$RELEASE_TIER" = claude ]; then
            claude --version | grep -F '2.1.283'
          fi
          {
            go version
            node --version
            "$SANDMAN_PORTAL_CHROMIUM" --version
            podman --version
            if [ "$RELEASE_TIER" = live ]; then
              opencode --version
            elif [ "$RELEASE_TIER" = claude ]; then
              claude --version
            fi
          } > regression-artifacts/versions.txt

      - name: Provision provider auth
        id: auth
        if: inputs.tier == 'live' || inputs.tier == 'claude'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.tier == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          RELEASE_TIER: ${{ inputs.tier }}
        run: |
          credential=OPENCODE_API_KEY
          if [ "$RELEASE_TIER" = claude ]; then
            credential=CLAUDE_CODE_OAUTH_TOKEN
          fi
          if [ -z "${!credential}" ]; then
            echo "::error::Required repository secret $credential is missing. Configure it before rerunning provider validation."
            exit 1
          fi
          if [ "$RELEASE_TIER" = live ]; then
          python3 - <<'PYAUTH'
          import json, os
          from pathlib import Path
          path = Path.home() / '.local/share/opencode/auth.json'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({'opencode': {'type': 'api', 'key': os.environ['OPENCODE_API_KEY']}}))
          path.chmod(0o600)
          PYAUTH
          fi

      - name: Execute tier
        id: tests
        env:
          RELEASE_TIER: ${{ inputs.tier }}
          SANDMAN_PORTAL_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
          SANDMAN_REQUIRE_PORTAL_BROWSER: "1"
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.tier == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: bash scripts/release_tier.sh

      - name: Evaluate complete scenario coverage
        if: ${{ always() }}
        env:
          RELEASE_PREREQUISITES: >-
            {"go":"${{ steps.go.outcome }}","node":"${{ steps.node.outcome }}",
            "chromium":"${{ steps.chrome.outcome }}","podman":"${{ steps.podman.outcome }}",
            "runtime":"${{ steps.runtime.outcome }}","container":"${{ steps.container.outcome }}",
            "agents":"${{ steps.agents.outcome }}","auth":"${{ steps.auth.outcome }}",
            "versions":"${{ steps.prerequisites.outcome }}","tests":"${{ steps.tests.outcome }}"}
          RELEASE_TIER: ${{ inputs.tier }}
        run: |
          rc=1
          if [ -f regression-artifacts/exit-code ]; then
            rc=$(cat regression-artifacts/exit-code)
          fi
          python3 scripts/release_report.py "$RELEASE_TIER" regression-artifacts/events.jsonl "$rc" regression-artifacts/report.json

      - name: Clean up tier containers
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          if command -v podman >/dev/null 2>&1; then
            podman ps -aq | xargs -r podman rm -f
          fi

      - name: Upload regression report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-regression-${{ inputs.tier }}-${{ github.sha }}
          path: regression-artifacts/
          if-no-files-found: error
