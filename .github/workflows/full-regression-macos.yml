name: Full Regression - macOS

# The job runs on every PR to main so it can be a required status check.
# The expensive suite only executes for release-please release PRs.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  full-regression:
    name: Full Regression Suite (macOS)
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      CI: true
      GIT_TERMINAL_PROMPT: "0"
      PAGER: cat
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      REPORT_FILE: regression-report-macos.md

    steps:
      - name: Detect release PR
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.head_ref }}" == release-please--branches--* ]]; then
            echo "RUN_REGRESSION=true" >> "$GITHUB_OUTPUT"
            echo "Running full regression suite."
          else
            echo "RUN_REGRESSION=false" >> "$GITHUB_OUTPUT"
            echo "Skipping full regression suite; this is not a release PR."
          fi

      - name: Checkout
        if: steps.gate.outputs.RUN_REGRESSION == 'true'
        uses: actions/checkout@v4

      - name: Set up Go
        if: steps.gate.outputs.RUN_REGRESSION == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check for Podman
        id: podman_check
        if: steps.gate.outputs.RUN_REGRESSION == 'true'
        run: |
          if command -v podman >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            podman info
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Podman not available on this runner."
          fi

      - name: Run full regression suite
        if: steps.gate.outputs.RUN_REGRESSION == 'true'
        shell: bash
        run: |
          set -uo pipefail

          RESULTS_FILE=$(mktemp)
          trap 'rm -f "$RESULTS_FILE"' EXIT

          log_tier() {
            local name=$1 status=$2 reason=$3
            printf '%s|%s|%s\n' "$name" "$status" "$reason" >> "$RESULTS_FILE"
          }

          run_tier() {
            local name=$1 cmd=$2
            echo "▶ Running $name"
            echo "::group::$name"

            set +e
            bash -c "$cmd"
            local rc=$?
            set -e
            echo "::endgroup::"

            if [ $rc -eq 0 ]; then
              log_tier "$name" "PASS" ""
              echo "  $name: PASS"
            else
              log_tier "$name" "FAIL" "exit code $rc"
              echo "  $name: FAIL (exit code $rc)"
            fi
          }

          skip_tier() {
            local name=$1 reason=$2
            log_tier "$name" "SKIP" "$reason"
            echo "  $name: SKIP ($reason)"
          }

          # Tier 1: Unit tests + race detector (matches `make test`)
          run_tier "Unit + Race" "go test -race -v ./..."

          # Tier 2: Smoke tests, every provider, every buildTools preset
          run_tier "Smoke" "SANDMAN_TEST_PROVIDERS=all SANDMAN_RUN_SMOKE_E2E=1 go test -tags smoke -timeout 60m ./internal/cmd -run Smoke"

          # Tier 3: E2E tests, every scenario gate
          run_tier "E2E" "SANDMAN_TEST_PROVIDERS=all SANDMAN_E2E_GATES=all go test -tags e2e -timeout 30m ./..."

          # Tier 4: Real-agent preset matrix, opt-in
          PODMAN_AVAILABLE="${{ steps.podman_check.outputs.available }}"
          if [ -f "$HOME/.local/share/opencode/auth.json" ] && [ "$PODMAN_AVAILABLE" = "true" ]; then
            run_tier "Real-agent Preset Matrix" "SANDMAN_RUN_AGENT_E2E=1 SANDMAN_TEST_PROVIDERS=all SANDMAN_E2E_GATES=all go test -tags e2e -timeout 90m ./internal/cmd -run TestPresetMatrixHarness"
          elif [ ! -f "$HOME/.local/share/opencode/auth.json" ]; then
            skip_tier "Real-agent Preset Matrix" "no opencode auth at $HOME/.local/share/opencode/auth.json"
          else
            skip_tier "Real-agent Preset Matrix" "podman not available"
          fi

          {
            echo "# Full Regression Report — macOS"
            echo ""
            echo "| Tier | Status | Details |"
            echo "|------|--------|---------|"
            while IFS='|' read -r name status reason; do
              emoji=""
              case "$status" in
                PASS) emoji="✅" ;;
                FAIL) emoji="❌" ;;
                SKIP) emoji="⏭️" ;;
                TIMEOUT) emoji="⏰" ;;
              esac
              echo "| $name | $emoji $status | $reason |"
            done < "$RESULTS_FILE"
            echo ""
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "# Full Regression Report — macOS"
            echo ""
            echo "| Tier | Status | Details |"
            echo "|------|--------|---------|"
            while IFS='|' read -r name status reason; do
              echo "| $name | $status | $reason |"
            done < "$RESULTS_FILE"
            echo ""
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$REPORT_FILE"

          final_rc=0
          while IFS='|' read -r name status reason; do
            if [ "$status" = "FAIL" ] || [ "$status" = "TIMEOUT" ]; then
              final_rc=1
            fi
          done < "$RESULTS_FILE"

          exit $final_rc

      - name: Upload regression report
        if: always() && steps.gate.outputs.RUN_REGRESSION == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-macos
          path: regression-report-macos.md
          if-no-files-found: ignore
