name: Full Regression - macOS

# The job runs the full suite on every PR to main.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  full-regression:
    name: Full Regression Suite (macOS)
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      CI: true
      GIT_TERMINAL_PROMPT: "0"
      PAGER: cat
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      REPORT_FILE: regression-report-macos.md

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check for Podman
        id: podman_check
        run: |
          if command -v podman >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            podman info
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Podman not available on this runner."
          fi

      - name: Run full regression suite
        shell: bash
        run: |
          set -uo pipefail

          RESULTS_FILE=$(mktemp)
          trap 'rm -f "$RESULTS_FILE"' EXIT

          log_tier() {
            local name=$1 status=$2 tests=$3 duration=$4 details=$5
            printf '%s|%s|%s|%s|%s\n' "$name" "$status" "$tests" "$duration" "$details" >> "$RESULTS_FILE"
          }

          run_tier() {
            local name=$1 cmd=$2
            local output started rc duration tests details status
            echo "▶ Running $name"
            echo "::group::$name"

            output=$(mktemp)
            started=$SECONDS
            set +e
            bash -c "$cmd" 2>&1 | tee "$output"
            rc=${PIPESTATUS[0]}
            set -e
            duration=$((SECONDS - started))
            tests=$(grep -c '^=== RUN' "$output" || true)
            rm -f "$output"
            echo "::endgroup::"

            if [ $rc -eq 0 ]; then
              if [ "$tests" -eq 0 ]; then
                status="FAIL"
                details="no test cases ran"
              else
                status="PASS"
                details=""
              fi
            else
              status="FAIL"
              details="exit code $rc"
            fi
            log_tier "$name" "$status" "$tests" "${duration}s" "$details"
            echo "  $name: $status ($tests tests, ${duration}s${details:+, $details})"
          }

          skip_tier() {
            local name=$1 reason=$2
            log_tier "$name" "SKIP" "0" "0s" "$reason"
            echo "  $name: SKIP ($reason)"
          }

          # Tier 1: Unit tests + race detector (matches `make test`)
          run_tier "Unit + Race" "go test -race -v ./..."

          # Tier 2: Focused smoke tests
          run_tier "Smoke" "SANDMAN_TEST_PROVIDERS=all SANDMAN_RUN_SMOKE_E2E=1 go test -v -tags smoke -timeout 60m ./internal/cmd -run Smoke"

          # Tier 3: E2E tests, every scenario gate and real-agent matrix
          run_tier "E2E" "SANDMAN_RUN_AGENT_E2E=1 SANDMAN_TEST_PROVIDERS=all SANDMAN_E2E_GATES=all go test -v -tags e2e -timeout 90m ./..."

          {
            echo "# Full Regression Report — macOS"
            echo ""
            echo "| Tier | Status | Tests run | Duration | Details |"
            echo "|------|--------|-----------|----------|---------|"
            while IFS='|' read -r name status tests duration details; do
              emoji=""
              case "$status" in
                PASS) emoji="✅" ;;
                FAIL) emoji="❌" ;;
                SKIP) emoji="⏭️" ;;
                TIMEOUT) emoji="⏰" ;;
              esac
              echo "| $name | $emoji $status | $tests | $duration | $details |"
            done < "$RESULTS_FILE"
            echo ""
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "# Full Regression Report — macOS"
            echo ""
            echo "| Tier | Status | Tests run | Duration | Details |"
            echo "|------|--------|-----------|----------|---------|"
            while IFS='|' read -r name status tests duration details; do
              echo "| $name | $status | $tests | $duration | $details |"
            done < "$RESULTS_FILE"
            echo ""
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$REPORT_FILE"

          final_rc=0
          while IFS='|' read -r name status tests duration details; do
            if [ "$status" = "FAIL" ] || [ "$status" = "TIMEOUT" ]; then
              final_rc=1
            fi
          done < "$RESULTS_FILE"

          exit $final_rc

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-macos
          path: regression-report-macos.md
          if-no-files-found: ignore
